name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test - verify build artifacts
        run: |
          echo "Checking build output..."
          ls -lh dist/
          test -f dist/index.html || (echo "Missing index.html" && exit 1)
          ls dist/assets/*.js > /dev/null 2>&1 || (echo "Missing JS bundle" && exit 1)
          echo "✅ Build artifacts look good"
