<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <filter id="glow1"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="glow2"><feGaussianBlur stdDeviation="50"/></filter>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Glows -->
  <circle cx="1050" cy="80" r="150" fill="rgba(16,185,129,0.12)" filter="url(#glow1)"/>
  <circle cx="150" cy="550" r="180" fill="rgba(59,130,246,0.08)" filter="url(#glow2)"/>
  
  <!-- Logo icon -->
  <rect x="80" y="140" width="56" height="56" rx="14" fill="url(#logo-grad)"/>
  <text x="108" y="178" text-anchor="middle" fill="white" font-family="system-ui,sans-serif" font-size="28" font-weight="800">S</text>
  
  <!-- Logo text -->
  <text x="150" y="178" fill="white" font-family="system-ui,sans-serif" font-size="32" font-weight="700">SignFlow </text>
  <text x="322" y="178" fill="#10b981" font-family="system-ui,sans-serif" font-size="32" font-weight="700">Pro</text>
  
  <!-- Headline -->
  <text x="80" y="280" fill="white" font-family="system-ui,sans-serif" font-size="48" font-weight="800">Shareable Links &amp; QR Codes</text>
  <text x="80" y="340" fill="white" font-family="system-ui,sans-serif" font-size="48" font-weight="800">for Zoho Sign Templates</text>
  
  <!-- Subtext -->
  <text x="80" y="400" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="22">Turn any Zoho Sign template into a permanent link or QR code.</text>
  <text x="80" y="432" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="22">No enterprise plan required.</text>
  
  <!-- Price badge -->
  <rect x="80" y="470" width="340" height="48" rx="10" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="250" y="502" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="20" font-weight="700">$60/year flat · No per-user fees</text>
  
  <!-- URL -->
  <text x="1120" y="590" text-anchor="end" fill="#64748b" font-family="system-ui,sans-serif" font-size="18" font-weight="600">signflow.ink</text>
</svg>
